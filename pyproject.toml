[project]
name = "aeon"
version = "0.1.0"
description = "Autonomous LLM perpetual-futures trading terminal for OKX"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.80",
    "httpx>=0.27",
    "websockets>=12",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
aeon = "aeon.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aeon*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
